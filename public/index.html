<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emp1st | Collaboration Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#1a1a1a',      
                        panel: '#282828',     
                        'panel-light': '#333333',
                        border: '#3e3e3e',    
                        accent: '#ffa116',    
                        success: '#2cbb5d',   
                        danger: '#ef4743',    
                        warning: '#fac02e',   
                    },
                    borderRadius: {
                        'xs': '2px',
                        'sm': '4px',
                        'md': '8px',
                        'lg': '12px',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3e3e3e; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555555; }

        input, select, textarea {
            background: #282828 !important;
            border: 1px solid #3e3e3e !important;
            border-radius: 5px !important;
            transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ffa116 !important;
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 161, 22, 0.1);
        }
        
        .app { height: 100%; position: relative; }
        .canvas { flex: 1; min-width: 0; }
    </style>
</head>
<body x-data="consoleApp()" x-init="init()" class="h-full bg-dark text-gray-200 selection:bg-accent/30 selection:text-white flex overflow-hidden">

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#1a1a1a] relative">
        
        <!-- Header -->
        <header class="h-12 border-b border-border flex items-center px-4 justify-between bg-dark sticky top-0 z-20">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-2 text-accent">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                    <span class="text-xs font-bold uppercase tracking-wider">Emp1st Collab</span>
                </div>
                
                <nav class="flex space-x-1">
                    <template x-for="st in ['entries', 'tasks', 'modules', 'dispatches']">
                        <button @click="switchSubTab(st)" 
                                :class="subTab === st ? 'text-white border-b-2 border-accent' : 'text-gray-500 hover:text-gray-300'" 
                                class="text-xs font-medium px-4 h-12 flex items-center transition-all capitalize" 
                                x-text="st"></button>
                    </template>
                </nav>
            </div>
            
            <div class="flex items-center space-x-3">
                <template x-if="loading">
                    <span class="flex items-center space-x-2 bg-accent/5 px-2 py-1 rounded border border-accent/20">
                        <span class="w-1.5 h-1.5 bg-accent rounded-full animate-pulse"></span>
                        <span class="text-[10px] text-accent font-medium">Syncing</span>
                    </span>
                </template>
                <div class="flex items-center space-x-2">
                    <button @click="runDoctor()" title="Run integrity checks"
                            class="text-xs font-medium px-3 py-1.5 rounded bg-panel border border-border text-gray-400 hover:text-white transition-all">Doctor</button>
                    <button @click="subTab === 'entries' ? createEntry() : (subTab === 'tasks' ? createTask() : createModule())"
                            class="text-xs font-semibold px-3 py-1.5 rounded bg-accent/10 border border-accent/20 text-accent hover:bg-accent hover:text-dark transition-all">
                        + New <span x-text="subTab.slice(0, -1)"></span>
                    </button>
                    <button @click="refresh()" class="p-2 text-gray-500 hover:text-accent transition-colors" :class="loading ? 'animate-spin' : ''">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Viewport -->
        <div class="flex-1 overflow-hidden flex">
            
            <div class="flex-1 flex overflow-hidden">
                <!-- Master List -->
                <div class="w-[320px] border-r border-border flex flex-col bg-dark/50 z-10">
                    <div class="p-4 space-y-3 border-b border-border">
                        <template x-if="subTab === 'entries'">
                            <div class="space-y-3">
                                <div class="flex p-0.5 bg-panel-light/30 border border-border rounded-md">
                                    <button @click="filterKind = 'signal'; searchCollab()" :class="filterKind === 'signal' ? 'bg-panel text-white' : 'text-gray-500 hover:text-gray-300'" class="flex-1 py-1.5 text-[10px] font-semibold uppercase rounded transition-all">Knowledge</button>
                                    <button @click="filterKind = 'log'; searchCollab()" :class="filterKind === 'log' ? 'bg-panel text-white' : 'text-gray-500 hover:text-gray-300'" class="flex-1 py-1.5 text-[10px] font-semibold uppercase rounded transition-all">Memory</button>
                                    <button @click="filterKind = 'any'; searchCollab()" :class="filterKind === 'any' ? 'bg-panel text-white' : 'text-gray-500 hover:text-gray-300'" class="flex-1 py-1.5 text-[10px] font-semibold uppercase rounded transition-all">All</button>
                                </div>
                                <div class="relative group">
                                    <input type="text" x-model="collabSearch" @keydown.enter="searchCollab()" placeholder="Search..."
                                           class="w-full bg-panel border border-border rounded-md py-2 pl-9 pr-3 text-xs focus:border-accent outline-none transition-all">
                                    <svg class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar">
                        <template x-if="subTab === 'entries'">
                            <template x-for="r in collabResults" :key="r.id">
                                <div @click="viewEntry(r.id)" class="p-3.5 border-b border-border/50 cursor-pointer transition-all border-l-2"
                                     :style="`border-left-color: ${activeEntryId === r.id ? '#ffa116' : 'transparent'}`"
                                     :class="activeEntryId === r.id ? 'bg-panel-light/30' : 'hover:bg-panel-light/10'">
                                    <div class="flex justify-between items-start mb-1.5">
                                        <span class="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded-xs" 
                                              :style="`color: ${typeColor(r.type)}; background: ${typeColor(r.type)}20; border: 1px solid ${typeColor(r.type)}30`" x-text="r.type"></span>
                                        <span class="text-[9px] font-mono text-gray-600" x-text="formatDateShort(r.created_at)"></span>
                                    </div>
                                    <h4 class="text-[13px] font-medium text-gray-200 truncate" x-text="r.title"></h4>
                                    <div class="text-[11px] text-gray-500 line-clamp-1 mt-1 font-normal" x-text="r.summary || 'No summary'"></div>
                                </div>
                            </template>
                        </template>
                        <template x-if="subTab === 'tasks'">
                            <template x-for="t in collabTasks" :key="t.id">
                                <div @click="viewTask(t)" class="p-3.5 border-b border-border/50 cursor-pointer transition-all border-l-2"
                                     :class="activeTaskId === t.id ? 'bg-panel-light/30 border-l-accent' : 'hover:bg-panel-light/10 border-l-transparent'">
                                    <div class="flex items-center justify-between">
                                        <div class="flex flex-col min-w-0">
                                            <span class="text-[10px] font-mono text-accent/80" x-text="t.id"></span>
                                            <h4 class="text-[13px] font-medium text-gray-200 truncate" x-text="t.title"></h4>
                                        </div>
                                        <span class="w-2 h-2 rounded-full" :style="`background: ${t.status === 'done' ? '#2cbb5d' : (t.status === 'in-progress' ? '#ffa116' : '#94a3b8')}`"></span>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template x-if="subTab === 'modules'">
                            <template x-for="m in collabModules" :key="m.slug">
                                <div @click="viewModule(m)" class="p-3.5 border-b border-border/50 cursor-pointer transition-all border-l-2"
                                     :class="activeModuleSlug === m.slug ? 'bg-panel-light/30 border-l-accent' : 'hover:bg-panel-light/10 border-l-transparent'">
                                    <h4 class="text-[13px] font-medium text-gray-200" x-text="'@' + m.slug"></h4>
                                    <p class="text-[11px] text-gray-500 mt-0.5" x-text="m.name"></p>
                                </div>
                            </template>
                        </template>
                    </div>
                </div>

                <!-- Detail View -->
                <div class="flex-1 flex flex-col bg-dark overflow-hidden">
                    <template x-if="subTab === 'entries' && activeEntryId">
                        <div class="flex-1 flex flex-col overflow-hidden">
                            <div class="p-6 border-b border-border bg-panel/10">
                                <div class="flex justify-between items-start mb-4">
                                    <div class="flex flex-wrap gap-2">
                                        <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-sm" :style="`color: ${typeColor(activeEntry.type)}; background: ${typeColor(activeEntry.type)}10; border: 1px solid ${typeColor(activeEntry.type)}20`" x-text="activeEntry.type"></span>
                                        <template x-if="activeEntry.module">
                                            <span @click="viewModule({slug: activeEntry.module}); subTab = 'modules'" class="cursor-pointer text-[10px] font-bold uppercase px-2 py-0.5 rounded-sm bg-panel-light/30 text-gray-400 border border-border hover:border-gray-500" x-text="'@' + activeEntry.module"></span>
                                        </template>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <div class="text-[10px] font-medium text-gray-500 text-right">
                                            <div x-text="formatDateLong(activeEntry.created_at)"></div>
                                        </div>
                                        <div class="flex space-x-1 border-l border-border pl-3">
                                            <button @click="editEntry()" class="p-1.5 text-gray-500 hover:text-white transition-colors"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 00 2 2h11a2 2 0 00 2-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                            <button @click="deleteEntry(activeEntry.id)" class="p-1.5 text-gray-500 hover:text-danger transition-colors"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                        </div>
                                    </div>
                                </div>
                                <h2 class="text-2xl font-bold text-white tracking-tight" x-text="activeEntry.title"></h2>
                            </div>
                            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                                <div class="max-w-3xl mx-auto space-y-8">
                                    <div class="bg-panel/20 border border-border p-5 rounded-md">
                                        <div class="text-[10px] font-bold uppercase text-gray-500 mb-2">Summary</div>
                                        <div class="text-base text-gray-300 leading-relaxed font-medium" x-text="activeEntry.summary"></div>
                                    </div>
                                    <div class="prose prose-invert max-w-none text-[15px] leading-relaxed text-gray-400 whitespace-pre-wrap font-normal" x-text="activeEntry.description"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template x-if="subTab === 'tasks' && activeTaskId">
                        <div class="flex-1 flex flex-col overflow-hidden">
                            <div class="p-6 border-b border-border bg-panel/10">
                                <div class="flex justify-between items-start mb-4">
                                    <span class="text-[10px] font-mono text-accent bg-accent/10 px-2 py-0.5 rounded-sm border border-accent/20" x-text="activeTask.id"></span>
                                    <div class="flex items-center space-x-3">
                                        <span class="text-[10px] font-bold uppercase text-gray-500" x-text="activeTask.status"></span>
                                        <div class="flex space-x-1 border-l border-border pl-3">
                                            <button @click="editTask()" class="p-1.5 text-gray-500 hover:text-white transition-colors"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 00 2 2h11a2 2 0 00 2-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                            <button @click="deleteTask(activeTask.id)" class="p-1.5 text-gray-500 hover:text-danger transition-colors"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                        </div>
                                    </div>
                                </div>
                                <h2 class="text-2xl font-bold text-white tracking-tight" x-text="activeTask.title"></h2>
                            </div>
                            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                                <div class="max-w-3xl mx-auto space-y-8">
                                    <div class="prose prose-invert max-w-none text-[15px] leading-relaxed text-gray-400 whitespace-pre-wrap font-normal" x-text="activeTask.description"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template x-if="subTab === 'modules' && activeModuleSlug">
                        <div class="flex-1 flex flex-col overflow-hidden">
                            <div class="p-6 border-b border-border bg-panel/10">
                                <div class="flex justify-between items-start mb-4">
                                    <h2 class="text-2xl font-bold text-white tracking-tight" x-text="'@' + activeModuleSlug"></h2>
                                    <div class="flex space-x-1 border-l border-border pl-3">
                                        <button @click="editModule()" class="p-1.5 text-gray-500 hover:text-white transition-colors"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 00 2 2h11a2 2 0 00 2-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                        <button @click="deleteModule(activeModuleSlug)" class="p-1.5 text-gray-500 hover:text-danger transition-colors"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                    </div>
                                </div>
                                <p class="text-sm text-gray-400" x-text="activeModule.name"></p>
                            </div>
                            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                                <div class="max-w-3xl mx-auto space-y-10">
                                    <div>
                                        <div class="text-[10px] font-bold uppercase text-gray-500 mb-2">Current Goal</div>
                                        <div class="bg-accent/5 border border-accent/20 p-4 rounded-md text-base font-semibold text-accent" x-text="activeModule.current_goal || 'No active goal set.'"></div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] font-bold uppercase text-gray-500 mb-2">Architecture Summary</div>
                                        <div class="prose prose-invert max-w-none text-[15px] leading-relaxed text-gray-400 whitespace-pre-wrap font-normal" x-text="activeModule.description"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Toasts -->
        <div class="fixed bottom-8 right-8 z-[200] space-y-3 pointer-events-none">
            <template x-for="t in toasts" :key="t.id">
                <div x-transition class="flex items-center space-x-4 bg-panel border border-border px-5 py-3.5 rounded-md shadow-xl pointer-events-auto min-w-[300px]">
                    <div class="w-1.5 h-1.5 rounded-full" :class="t.type === 'err' ? 'bg-danger' : 'bg-success'"></div>
                    <div class="flex-1">
                        <div class="text-[10px] font-bold uppercase text-gray-500" x-text="t.type === 'err' ? 'System Error' : 'System Notice'"></div>
                        <div class="text-[13px] font-medium text-white mt-0.5" x-text="t.msg"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- CRUD Modals -->
        <div x-show="editMode" x-cloak class="fixed inset-0 z-[300] flex items-center justify-center p-4 backdrop-blur-xs bg-black/40">
            <div @click.away="editMode = null" class="w-full max-w-xl bg-panel border border-border rounded-md shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <header class="px-6 py-4 border-b border-border flex justify-between items-center bg-panel-light/20">
                    <h3 class="text-sm font-semibold text-white uppercase tracking-wider" x-text="editMode === 'entry' ? (entryForm.id ? 'Edit Entry' : 'New Entry') : (editMode === 'task' ? (taskForm.id ? 'Edit Task' : 'New Task') : (moduleForm.slug ? 'Edit Module' : 'New Module'))"></h3>
                    <button @click="editMode = null" class="text-gray-500 hover:text-white transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </header>

                <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                    <!-- Entry Form -->
                    <template x-if="editMode === 'entry'">
                        <div class="space-y-5">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold uppercase text-gray-500">Type</label>
                                    <select x-model="entryForm.type" class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                                        <option value="handoff">Handoff</option>
                                        <option value="decision">Decision</option>
                                        <option value="gotcha">Gotcha</option>
                                        <option value="review">Review</option>
                                        <option value="proposal">Proposal</option>
                                        <option value="session-note">Session Note</option>
                                        <option value="changelog">Changelog</option>
                                    </select>
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold uppercase text-gray-500">Module</label>
                                    <select x-model="entryForm.module" class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                                        <option value="">(global)</option>
                                        <template x-for="m in collabModules" :key="m.slug">
                                            <option :value="m.slug" x-text="'@' + m.slug"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Title</label>
                                <input type="text" x-model="entryForm.title" placeholder="Title..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Summary</label>
                                <textarea x-model="entryForm.summary" rows="2" placeholder="Brief summary..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none resize-none"></textarea>
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Description</label>
                                <textarea x-model="entryForm.description" rows="6" placeholder="Details..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white font-mono focus:border-accent outline-none custom-scrollbar"></textarea>
                            </div>
                        </div>
                    </template>

                    <!-- Task Form -->
                    <template x-if="editMode === 'task'">
                        <div class="space-y-5">
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Title</label>
                                <input type="text" x-model="taskForm.title" placeholder="Task title..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold uppercase text-gray-500">Status</label>
                                    <select x-model="taskForm.status" class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                                        <option value="pending">Pending</option>
                                        <option value="assigned">Assigned</option>
                                        <option value="in-progress">In Progress</option>
                                        <option value="review">Review</option>
                                        <option value="done">Done</option>
                                    </select>
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold uppercase text-gray-500">Priority</label>
                                    <select x-model="taskForm.priority" class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                        <option value="critical">Critical</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold uppercase text-gray-500">Assignee</label>
                                    <select x-model="taskForm.assignee" class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                                        <option :value="null">Unassigned</option>
                                        <option value="Claude">Claude</option>
                                        <option value="Codex">Codex</option>
                                        <option value="Gemini">Gemini</option>
                                        <option value="User">User</option>
                                    </select>
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold uppercase text-gray-500">Module</label>
                                    <select x-model="taskForm.module" class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                                        <option value="">(global)</option>
                                        <template x-for="m in collabModules" :key="m.slug">
                                            <option :value="m.slug" x-text="'@' + m.slug"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Summary</label>
                                <input type="text" x-model="taskForm.summary" placeholder="Summary..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Technical Details</label>
                                <textarea x-model="taskForm.description" rows="5" placeholder="Details..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white font-mono focus:border-accent outline-none custom-scrollbar"></textarea>
                            </div>
                        </div>
                    </template>

                    <!-- Module Form -->
                    <template x-if="editMode === 'module'">
                        <div class="space-y-5">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold uppercase text-gray-500">Slug</label>
                                    <input type="text" x-model="moduleForm.slug" :disabled="activeModuleSlug" placeholder="Slug..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none disabled:opacity-50">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-bold uppercase text-gray-500">Name</label>
                                    <input type="text" x-model="moduleForm.name" placeholder="Name..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                                </div>
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Current Goal</label>
                                <input type="text" x-model="moduleForm.current_goal" placeholder="Goal..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white focus:border-accent outline-none">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Description</label>
                                <textarea x-model="moduleForm.description" rows="6" placeholder="Description..." class="w-full bg-dark border border-border rounded px-3 py-2 text-xs text-white font-mono focus:border-accent outline-none custom-scrollbar"></textarea>
                            </div>
                        </div>
                    </template>
                </div>

                <footer class="px-6 py-4 border-t border-border bg-panel-light/10 flex justify-end space-x-3">
                    <button @click="editMode = null" class="text-[11px] font-semibold uppercase px-4 py-2 rounded border border-border text-gray-400 hover:text-white transition-all">Cancel</button>
                    <button @click="editMode === 'entry' ? saveEntry() : (editMode === 'task' ? saveTask() : saveModule())" 
                            class="text-[11px] font-semibold uppercase px-4 py-2 rounded bg-accent text-white hover:bg-accent/90 transition-all">
                        Save Changes
                    </button>
                </footer>
            </div>
        </div>

    </main>

</body>
</html>
